<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Destruction Derby 2 — dd2h.exe → WASM (decompiled engine)</title>
  <style>
    html,body{margin:0;height:100%;background:#0c0d10;color:#cfd3dc;font-family:system-ui,sans-serif;}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
    h1{font-size:14px;font-weight:500;opacity:.7;margin:8px 0 0;}
    .hint{font-size:12px;opacity:.5;margin:0;}
    .hint b{color:#e3b778;}
    canvas{background:#000;image-rendering:pixelated;width:640px;height:480px;border-radius:4px;
      outline:none;box-shadow:0 8px 30px rgba(0,0,0,.6);}
  </style>
</head>
<body>
  <h1>Destruction Derby 2 — dd2h.exe decompiled → WASM (interactive)</h1>
  <canvas id="canvas" width="320" height="240" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <p class="hint"><b>A</b> accelerate &nbsp;·&nbsp; <b>Z</b> brake/reverse &nbsp;·&nbsp; <b>Arrows</b> steer &nbsp;·&nbsp; <b>Enter</b> accept &nbsp;·&nbsp; <b>Esc</b> back/pause &nbsp;·&nbsp; gamepad supported &nbsp;·&nbsp; click canvas to focus</p>
  <script>
    var canvas = document.getElementById('canvas');
    var _q = new URLSearchParams(location.search);
    var Module = {
      canvas: canvas,
      arguments: (!_q.has('race') && !_q.has('demo')) ? ['fe'] : [],
      print: (...a)=>console.log(...a),
      printErr: (...a)=>console.error(...a),
      preRun: [function(){
        // Interactive browser defaults: live race with sound. (URL ?demo runs the attract,
        // ?level=N picks the track; the FE menu flow replaces this once its rendering lands.)
        var q = new URLSearchParams(location.search);
        ENV.DD2_SOUND = '1';
        ENV.DD2_REALTIME = '1';   // faithful 25fps pacing (engine frame limiter on real time)
        // Default boot = the REAL front end (title -> menus -> track select -> race), like the
        // original ddmain. ?race=N boots straight into a live race, ?demo runs the attract.
        if (q.has('race')) { ENV.DD2_LIVE = '1'; ENV.DD2_LEVEL = q.get('race') || '9'; }
        else if (q.has('demo')) { ENV.DD2_LEVEL = q.get('level') || '9'; }
        // default: Module.arguments=['fe'] (set below) boots the real front end
        // Joystick play (the original's FE controls option): auto-picked when a gamepad is
        // already connected at load, or forced via ?pad. Keyboard stays active alongside.
        var pads = navigator.getGamepads ? navigator.getGamepads() : [];
        var padHere = false; for (var i=0;i<pads.length;i++) if (pads[i] && pads[i].connected) padHere = true;
        if (padHere || q.has('pad')) ENV.DD2_PAD = '1';
      },
      // Persist the memory card (SaveGames) across page reloads via IndexedDB. The engine opens
      // "SaveGames" at the FS root; we back that path with an IDBFS mount at /persist and load its
      // contents BEFORE main() runs (addRunDependency gates the boot on the async syncfs). On a
      // first-ever run /persist/SaveGames is absent -> InitCardSystem recreates a fresh 128KB card
      // (byte-identical to the shipped file). Writes land in /persist and are flushed back to
      // IndexedDB on tab-hide / unload (syncfs(false)). No engine change; native/node use real disk.
      function(){
        try {
          FS.mkdir('/persist');
          FS.mount(IDBFS, {}, '/persist');
          Module.addRunDependency('idbfs-load');
          FS.syncfs(true, function(err){
            if (err) console.error('IDBFS load failed', err);
            try { FS.unlink('/SaveGames'); } catch(e){}          // drop any stale root node
            try { FS.symlink('/persist/SaveGames', '/SaveGames'); } catch(e){ console.error('symlink SaveGames', e); }
            Module.removeRunDependency('idbfs-load');
          });
        } catch(e){ console.error('IDBFS mount failed', e); }
      }],
      onRuntimeInitialized: function(){
        // Flush the memory card to IndexedDB when the tab is hidden or closing (the engine has no
        // save-completion callback, so persist opportunistically on the way out).
        var _persist = function(){ try { FS.syncfs(false, function(){}); } catch(e){} };
        document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='hidden') _persist(); });
        window.addEventListener('pagehide', _persist);
        window.addEventListener('beforeunload', _persist);
        // Route real keyboard events to the engine: keydown/keyup -> dd2_browser_key_event(code, down).
        var send = function(code, down){
          try { Module.ccall('dd2_browser_key_event', 'number', ['string','number'], [code, down]); }
          catch(e){ /* not ready yet */ }
        };
        // Named non-letter keys the game uses directly.
        var handled = {ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1,Enter:1,Escape:1,Space:1,F1:1,F2:1};
        // Forward EVERY letter (KeyA..KeyZ) and digit (Digit0..Digit9): the keyboard-rebind screen
        // must accept ANY key, and the engine ignores unbound VKs. The old 13-key allowlist dropped
        // D/Q/E/etc. -> those keys never reached dd2_key_event, so a browser rebind to them failed
        // (matched the native rebind only for W/A/S/Z). dd2_browser_key_to_vk maps all of these.
        for (var _c=65;_c<=90;_c++) handled['Key'+String.fromCharCode(_c)]=1;   // KeyA..KeyZ
        for (var _d=0;_d<=9;_d++)   handled['Digit'+_d]=1;                       // Digit0..Digit9
        window.addEventListener('keydown', function(e){ if(handled[e.code]){ e.preventDefault(); send(e.code, 1); } });
        window.addEventListener('keyup',   function(e){ if(handled[e.code]){ e.preventDefault(); send(e.code, 0); } });
        // Gamepad API -> engine joystick backend (dd2_pad_update in dd2h_stubs.c).
        // Axes 0/1 -> 0..65535 (center 32768), buttons -> bitmask (A=1, B=2, X=4, Y=8, ...).
        // The engine detects the pad ONCE at boot (faithful Windows joyGetPos semantics), so a
        // pad connected before/while the page loads is picked up; DD2 uses buttons 1+2 = accel/brake.
        var padPoll = function(){
          var gps = navigator.getGamepads ? navigator.getGamepads() : [];
          var gp = null;
          for (var i=0;i<gps.length;i++) if (gps[i] && gps[i].connected){ gp = gps[i]; break; }
          if (gp) {
            var x = Math.max(0, Math.min(65535, Math.round((gp.axes[0]+1)*32767.5)));
            var y = Math.max(0, Math.min(65535, Math.round((gp.axes[1]+1)*32767.5)));
            var b = 0;
            for (var j=0;j<gp.buttons.length && j<16;j++) if (gp.buttons[j].pressed) b |= (1<<j);
            try { Module.ccall('dd2_pad_update', null, ['number','number','number','number'], [1, x, y, b]); }
            catch(e){}
          }
          requestAnimationFrame(padPoll);
        };
        requestAnimationFrame(padPoll);
        canvas.focus();
      }
    };
    canvas.addEventListener('click', ()=>canvas.focus());
  </script>
  {{{ SCRIPT }}}
</body>
</html>
